events {}

http {
    upstream glashaus_api {
        server api:8000;
    }
    upstream glashaus_web {
        server web:3000;
    }

    server {
        listen 80;
        
        # 1. API Routing (Requests starting with /audit, /reports, /docs)
        location ~ ^/(audit|reports|docs|openapi.json|debug) {
            proxy_pass http://glashaus_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Frontend Routing (Everything else)
        location / {
            proxy_pass http://glashaus_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket support for Next.js HMR (Hot Module Replacement)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health check
        location /health {
            return 200 'alive';
            add_header Content-Type text/plain;
        }
    }
}
