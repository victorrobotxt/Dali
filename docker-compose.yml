services:
  # 1. GATEWAY (Entry Point)
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      - api

  # 2. API (Internal)
  api:
    build: .
    expose:
      - "8000"
    env_file: .env                 # <--- LOADS SECRETS FROM .env FILE
    environment:
      - POSTGRES_HOST=db           # <--- FIXED (Was POSTGRES_SERVER)
    depends_on:
      - db
      - redis

  # 3. WORKER
  worker:
    build: .
    command: celery -A src.worker.celery_app worker --loglevel=info
    env_file: .env                 # <--- LOADS SECRETS FROM .env FILE
    environment:
      - POSTGRES_HOST=db           # <--- FIXED
    depends_on:
      - db
      - redis

  # 4. REDIS
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 5. DB
  db:
    image: postgis/postgis:15-3.4
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env                 # <--- LOADS DB CREDENTIALS
    ports:
      - "5432:5432"

volumes:
  postgres_data:
